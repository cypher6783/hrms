<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex justify-between items-center px-md h-14 z-40">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined cursor-pointer active:opacity-80 text-on-surface-variant hover:bg-surface-container-high transition-colors p-xs rounded-full">menu</span>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">LassaOps Command</h1>

<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant overflow-hidden cursor-pointer active:opacity-80">

<div class="p-md space-y-md">
<!-- Search & Filters -->
<div class="space-y-sm">
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:border-[#0EA5E9] focus:ring-1 focus:ring-[#0EA5E9] transition-all" placeholder="Search Patient ID..." type="text"/>
</div>
<div class="flex gap-sm overflow-x-auto pb-xs scrollbar-hide">
<button class="whitespace-nowrap px-sm py-xs bg-primary-container text-on-primary-container rounded-full font-label-md text-label-md border border-primary-container">All</button>
<button class="whitespace-nowrap px-sm py-xs bg-surface-container-lowest text-on-surface-variant rounded-full font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-colors">High Priority</button>
<button class="whitespace-nowrap px-sm py-xs bg-surface-container-lowest text-on-surface-variant rounded-full font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-colors">Awaiting Bed</button>
<button class="whitespace-nowrap px-sm py-xs bg-surface-container-lowest text-on-surface-variant rounded-full font-label-md text-label-md border border-outline-variant hover:bg-surface-container-low transition-colors">Isolation</button>
</div>
</div>

<div class="space-y-md">
<!-- Patient Card: High Priority -->

<div class="absolute top-0 left-0 w-1 h-full bg-error"></div>
<div class="flex justify-between items-start mb-sm ml-xs">
<div>
<span class="font-data-mono text-data-mono text-on-surface">BSUTH-4092</span>
<div class="flex gap-xs mt-xs">
<span class="px-xs py-[2px] bg-error-container text-on-error-container rounded font-label-md text-label-md">High</span>
<span class="px-xs py-[2px] bg-[#FEF3C7] text-[#92400E] rounded font-label-md text-label-md">Required</span>
</div>
</div>
<span class="px-sm py-xs bg-surface-container text-on-surface-variant rounded font-label-md text-label-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">location_on</span> ER
                        </span>
</div>
<div class="ml-xs mb-md pb-sm border-b border-surface-container-high">
<div class="flex items-center gap-sm text-on-surface-variant font-body-md">
<span class="material-symbols-outlined text-[18px]">pending_actions</span>

</div>
</div>

<span class="material-symbols-outlined text-[16px]">location_on</span> Ward B
                        </span>
</div>
<div class="ml-xs mb-md pb-sm border-b border-surface-container-high">
<div class="flex items-center gap-sm text-on-surface-variant font-body-md">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span>Allocated</span>
</div>
</div>
<div class="flex gap-sm ml-xs">
<button class="flex-1 bg-surface-container-lowest text-on-surface border border-outline-variant py-sm rounded font-label-md text-label-md hover:bg-surface-container-low active:scale-95 transition-all text-center w-full">View Details</button>

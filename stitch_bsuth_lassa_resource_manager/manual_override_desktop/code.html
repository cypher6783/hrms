<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manual Override Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#e4e2e4",
                      "on-primary-container": "#7c839b",
                      "surface-container": "#f0edef",
                      "surface": "#fcf8fa",
                      "on-secondary-container": "#57657b",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#dae2fd",
                      "inverse-surface": "#303032",
                      "outline-variant": "#c6c6cd",
                      "secondary-fixed": "#d5e3fd",
                      "surface-container-highest": "#e4e2e4",
                      "on-secondary-fixed": "#0d1c2f",
                      "surface-bright": "#fcf8fa",
                      "on-tertiary-fixed": "#271901",
                      "inverse-on-surface": "#f3f0f2",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-error": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "surface-dim": "#dcd9db",
                      "primary": "#000000",
                      "outline": "#76777d",
                      "on-surface": "#1b1b1d",
                      "primary-fixed-dim": "#bec6e0",
                      "inverse-primary": "#bec6e0",
                      "on-secondary-fixed-variant": "#3a485c",
                      "on-surface-variant": "#45464d",
                      "tertiary": "#000000",
                      "error-container": "#ffdad6",
                      "surface-container-high": "#eae7e9",
                      "surface-container-low": "#f6f3f5",
                      "surface-tint": "#565e74",
                      "tertiary-container": "#271901",
                      "on-primary-fixed": "#131b2e",
                      "on-tertiary-fixed-variant": "#574425",
                      "on-background": "#1b1b1d",
                      "on-error-container": "#93000a",
                      "tertiary-fixed-dim": "#dec29a",
                      "primary-container": "#131b2e",
                      "secondary-fixed-dim": "#b9c7e0",
                      "on-primary": "#ffffff",
                      "tertiary-fixed": "#fcdeb5",
                      "on-secondary": "#ffffff",
                      "background": "#fcf8fa",
                      "secondary": "#515f74",
                      "secondary-container": "#d5e3fd",
                      "error": "#ba1a1a",
                      "on-tertiary-container": "#98805d"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "16px",
                      "margin-mobile": "16px",
                      "xl": "32px",
                      "lg": "24px",
                      "margin-desktop": "32px",
                      "xs": "4px",
                      "gutter": "16px",
                      "base": "4px",
                      "sm": "8px"
              },
              "fontFamily": {
                      "label-md": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "data-mono": [
                              "Inter"
                      ],
                      "headline-sm": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "display-lg-mobile": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-lg": [
                              "36px",
                              {
                                      "lineHeight": "44px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "data-mono": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-sm": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "34px",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-shadow {
            box-shadow: 0px 4px 6px -1px rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body class="bg-surface-variant flex items-center justify-center min-h-screen p-md font-body-md text-on-surface">
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 bg-inverse-surface/40 flex items-center justify-center z-50 px-md">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-xl flex flex-col modal-shadow border border-outline-variant overflow-hidden">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant bg-surface flex justify-between items-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface m-0">Manual Override: Allocation Recommendation</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- Original Recommendation Section -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-md text-label-md text-on-surface-variant">ORIGINAL RECOMMENDATION</span>
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined text-[16px]">verified</span>
<span class="font-data-mono text-data-mono">Allocation Score: 98</span>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bed</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Recommended: Bed B-014</span>
</div>
</div>
<!-- Final Decision Section -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="new-allocation">Select New Allocation</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded h-10 px-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all cursor-pointer" id="new-allocation">
<option disabled="" selected="" value="">Select a bed...</option>
<option value="A-001">Bed A-001 (Available)</option>
<option value="A-002">Bed A-002 (Available)</option>
<option value="B-015">Bed B-015 (Available)</option>
<option value="C-101">Bed C-101 (Requires Cleaning)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Override Reason Section -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="override-reason">Reason for Override (Required)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded p-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-none" id="override-reason" placeholder="Provide clinical or operational justification..." rows="4"></textarea>
</div>
</div>
<!-- Footer / Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface flex flex-col sm:flex-row items-center justify-between gap-md sm:gap-0">
<!-- Audit Notice -->
<div class="flex items-center gap-xs text-on-surface-variant w-full sm:w-auto justify-center sm:justify-start">
<span class="material-symbols-outlined text-[16px]">info</span>
<span class="font-body-md text-[12px] leading-[16px]">This override will be recorded in the audit trail.</span>
</div>
<!-- Action Buttons -->
<div class="flex gap-sm w-full sm:w-auto justify-end">
<button class="px-md h-10 border border-outline-variant rounded font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors flex items-center justify-center min-w-[100px] w-full sm:w-auto" type="button">
                        Cancel
                    </button>
<!-- Disabled State Example - Requires JS to enable based on textarea input -->
<button class="px-md h-10 bg-primary text-on-primary rounded font-label-md text-label-md hover:bg-primary/90 transition-colors flex items-center justify-center min-w-[160px] w-full sm:w-auto opacity-50 cursor-not-allowed" disabled="" id="confirm-btn" type="button">
                        Confirm Override
                    </button>
</div>
</div>
</div>
</div>
<script>
        // Simple script to enable/disable confirm button based on reason input
        document.addEventListener('DOMContentLoaded', () => {
            const reasonInput = document.getElementById('override-reason');
            const confirmBtn = document.getElementById('confirm-btn');

            reasonInput.addEventListener('input', () => {
                if (reasonInput.value.trim().length > 0) {
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    confirmBtn.disabled = true;
                    confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body></html>

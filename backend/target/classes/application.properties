# Server
server.port=8080

# Application
spring.application.name=Hospital Resource Management
spring.profiles.active=dev

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/hospital_resource
spring.datasource.username=postgres
spring.datasource.password=asphalt6
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgdG9rZW4gc2lnbmluZw==
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.hospital.resource=INFO
logging.level.org.springframework.security=WARN
